<text x="530" y="42" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#1a237e">会话与记忆子系统框图</text><text x="530" y="844" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" fill="#9e9e9e">短期记忆(agent_short_term_memory) + 会话摘要(agent_conversation_summary) + 会话管理(agent_conversation) · 存储于 PostgreSQL</text><rect x="330" y="66" width="400" height="54" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="530" y="89.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">对话主流程（AgentServiceImpl / ReactiveStreamingService）</text><text x="530" y="106.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">每轮：读历史 + 读摘要 + 写消息 + 触发摘要</text><defs><marker id="a546e7a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/></marker></defs><line x1="530" y1="120" x2="190" y2="168" stroke="#546e7a" stroke-width="1.8" marker-end="url(#a546e7a)"/><defs><marker id="a546e7a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/></marker></defs><line x1="530" y1="120" x2="530" y2="168" stroke="#546e7a" stroke-width="1.8" marker-end="url(#a546e7a)"/><defs><marker id="a546e7a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/></marker></defs><line x1="530" y1="120" x2="870" y2="168" stroke="#546e7a" stroke-width="1.8" marker-end="url(#a546e7a)"/><rect x="70" y="168" width="240" height="260" rx="8" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1.5"/><text x="190" y="269" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#4a148c">ShortTermMemoryService</text><text x="190" y="286" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">listRecentMessages(userId, convId, 20)</text><text x="190" y="303" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">saveUserAndAssistantMessages</text><text x="190" y="320" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">saveMessage(role, content, metadata)</text><text x="190" y="337" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">estimateTokenCount(content)</text><rect x="410" y="168" width="240" height="260" rx="8" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1.5"/><text x="530" y="269" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#4a148c">ConversationSummaryService</text><text x="530" y="286" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">getSummary(userId, convId)</text><text x="530" y="303" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">triggerSummaryIfNeeded（@Async）</text><text x="530" y="320" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">消息&gt;20 且新增≥10 → LLM 生成</text><text x="530" y="337" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">covered_message_order 增量更新</text><rect x="750" y="168" width="240" height="260" rx="8" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1.5"/><text x="870" y="269" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#4a148c">ConversationService</text><text x="870" y="286" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">createConversation / list / get</text><text x="870" y="303" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">updateTitle / delete</text><text x="870" y="320" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">validateConversationOwner</text><text x="870" y="337" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">touchConversation（更新活跃时间）</text><defs><marker id="a78909c" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs><line x1="190" y1="428" x2="190" y2="470" stroke="#78909c" stroke-width="1.8" marker-end="url(#a78909c)"/><defs><marker id="a78909c" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs><line x1="530" y1="428" x2="530" y2="470" stroke="#78909c" stroke-width="1.8" marker-end="url(#a78909c)"/><defs><marker id="a78909c" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker></defs><line x1="870" y1="428" x2="870" y2="470" stroke="#78909c" stroke-width="1.8" marker-end="url(#a78909c)"/><rect x="70" y="470" width="240" height="92" rx="8" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><text x="190" y="495.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#263238">agent_short_term_memory</text><text x="190" y="512.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">userId + conversationId 隔离</text><text x="190" y="529.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">role / content / message_order</text><text x="190" y="546.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">token_count / metadata(JSONB)</text><rect x="410" y="470" width="240" height="92" rx="8" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><text x="530" y="495.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#263238">agent_conversation_summary</text><text x="530" y="512.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">userId + conversationId</text><text x="530" y="529.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">summary（≤2000 字，中文）</text><text x="530" y="546.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">covered_message_order</text><rect x="750" y="470" width="240" height="92" rx="8" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/><text x="870" y="504" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#263238">agent_conversation</text><text x="870" y="521" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">会话标题 / 创建时间</text><text x="870" y="538" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">最近活跃时间 / 消息数</text><rect x="70" y="600" width="920" height="210" rx="10" fill="#f4f6f8" stroke="#78909c" stroke-width="1"/><text x="90" y="628" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="13.5" font-weight="bold" fill="#455a64">记忆策略要点</text><text x="90" y="654" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="12" fill="#546e7a">· 回答阶段读取最近 20 条短期记忆；意图识别阶段仅取最近 5 条（减少上下文噪声）。</text><text x="90" y="676" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="12" fill="#546e7a">· 会话摘要用于承载超出 20 条窗口的长期信息：每轮对话后触发 triggerSummaryIfNeeded，增量压缩。</text><text x="90" y="698" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="12" fill="#546e7a">· 摘要逻辑：保留稳定目标/偏好/约束/决策/关键实体/文件名/接口名/参数/错误与未决问题，丢弃寒暄。</text><text x="90" y="720" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="12" fill="#546e7a">· 会话标题：首次提问截取前 20 字；未传 conversationId 时自动创建会话。</text><text x="90" y="742" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="12" fill="#546e7a">· 短期记忆元数据：记录 intentType、rewrittenQuery、queryRewritten 供后续检索与回溯。</text><text x="90" y="764" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="12" fill="#546e7a">· Redis 仅用于登录 Token；会话消息与摘要均落 PostgreSQL，保证可查询与恢复。</text><text x="90" y="786" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="12" fill="#546e7a">· 历史消息上限 200 条供前端展示；删除会话采用软删除（deleted 标记）。</text>
