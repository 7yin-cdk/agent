<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#ffffff;overflow:hidden}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="830" viewBox="0 0 960 830" style="display:block">
<text x="480" y="42" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#1a237e">认证鉴权流程（JWT Token + Redis）</text><text x="480" y="814" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" fill="#9e9e9e">AuthController + AuthService + AuthTokenFilter · Token 存 Redis（agent:login:token:*，TTL 604800s）</text><rect x="220" y="70" width="520" height="52" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/><text x="480" y="92.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#1b5e20">1. 注册 POST /auth/register</text><text x="480" y="109.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">AuthService.register · 用户名密码校验</text><text x="780" y="96" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" fill="#2e7d32">BCrypt 加密存 agent_user</text><defs><marker id="m43a047" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#43a047"/></marker></defs><line x1="480" y1="122" x2="480" y2="146" stroke="#43a047" stroke-width="2" marker-end="url(#m43a047)"/><rect x="220" y="150" width="520" height="52" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/><text x="480" y="172.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#1b5e20">2. 登录 POST /auth/login</text><text x="480" y="189.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">校验用户名密码 → 生成 Token（TokenUtil）</text><defs><marker id="m43a047" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#43a047"/></marker></defs><line x1="480" y1="202" x2="480" y2="226" stroke="#43a047" stroke-width="2" marker-end="url(#m43a047)"/><rect x="220" y="230" width="520" height="56" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="480" y="254.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">3. Token 写入 Redis</text><text x="480" y="271.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">key=agent:login:token:{token} · TTL=604800s（7天）</text><text x="780" y="258" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" fill="#2e7d32">返回 LoginResponse(token, userInfo)</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="480" y1="286" x2="480" y2="310" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="220" y="314" width="520" height="52" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/><text x="480" y="336.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#1b5e20">4. 后续请求携带 Token</text><text x="480" y="353.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">Authorization: Bearer {token} 或 X-Auth-Token</text><defs><marker id="m43a047" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#43a047"/></marker></defs><line x1="480" y1="366" x2="480" y2="390" stroke="#43a047" stroke-width="2" marker-end="url(#m43a047)"/><rect x="220" y="394" width="520" height="52" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/><text x="480" y="416.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#7a5900">5. AuthTokenFilter 拦截解析</text><text x="480" y="433.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">解析 Token → Redis 校验 → 组装 UserContext</text><text x="780" y="420" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" fill="#c62828">校验失败 → 401 未授权</text><defs><marker id="m43a047" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#43a047"/></marker></defs><line x1="480" y1="446" x2="480" y2="470" stroke="#43a047" stroke-width="2" marker-end="url(#m43a047)"/><rect x="220" y="474" width="520" height="56" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/><text x="480" y="498.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#7a5900">6. 写入 UserContextHolder（ThreadLocal）</text><text x="480" y="515.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">后续 Service 通过 getUserId() 获取当前用户</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="480" y1="530" x2="480" y2="554" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="220" y="558" width="520" height="52" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="480" y="580.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">7. 访问业务接口</text><text x="480" y="597.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">/agent/chat · /agent/conversations · /healthcheck/run 等</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="480" y1="610" x2="480" y2="634" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="220" y="638" width="520" height="52" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/><text x="480" y="660.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#1b5e20">8. 退出登录 POST /auth/logout</text><text x="480" y="677.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">删除 Redis 中的 Token 记录</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="480" y1="690" x2="480" y2="714" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="220" y="718" width="520" height="52" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/><text x="480" y="740.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#1b5e20">9. GET /auth/me 查询当前用户</text><text x="480" y="757.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">从 UserContextHolder 返回用户信息</text>
</svg>
</body></html>
