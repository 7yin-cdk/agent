2="470" y2="630" stroke="#ab47bc" stroke-width="2" marker-end="url(#mab47bc)"/><rect x="250" y="634" width="440" height="58" rx="8" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1.5"/><text x="470" y="651" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#4a148c">8. 文本分块 splitText</text><text x="470" y="668" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">段落切分 → 合并短段 → 递归拆分</text><text x="470" y="685" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">→ 合并小块 → 添加 overlap</text><rect x="730" y="634" width="200" height="118" rx="6" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1" stroke-dasharray="5,3"/><text x="740" y="656" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#4a148c">分块参数</text><text x="740" y="678" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" fill="#4a148c">MAX_CHUNK_SIZE = 400</text><text x="740" y="697" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" fill="#4a148c">OVERLAP_SIZE = 100</text><text x="740" y="716" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" fill="#4a148c">分隔符：\n 。！？ ， ,</text><text x="740" y="735" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" fill="#4a148c">递归拆分 + 强制截断兜底</text><defs><marker id="mab47bc" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ab47bc"/></marker></defs><line x1="470" y1="692" x2="470" y2="714" stroke="#ab47bc" stroke-width="2" marker-end="url(#mab47bc)"/><rect x="250" y="718" width="440" height="52" rx="8" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1.5"/><text x="470" y="740.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#4a148c">9. 分块向量化 llmService.embed</text><text x="470" y="757.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">每批≤10 条 · text-embedding-v4 → 1536 维</text><defs><marker id="mab47bc" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ab47bc"/></marker></defs><line x1="470" y1="770" x2="470" y2="794" stroke="#ab47bc" stroke-width="2" marker-end="url(#mab47bc)"/><rect x="250" y="798" width="440" height="56" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="470" y="814" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">10. 分片与向量入库 saveChunks（事务）</text><text x="470" y="831" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">雪花ID → text_chunk + text_chunk_vector 批量插入</text><text x="470" y="848" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">+ keywordSearchService.indexChunks → ES 索引</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="470" y1="854" x2="470" y2="878" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="250" y="882" width="440" height="52" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/><text x="470" y="904.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#0d47a1">11. 异步任务完成</text><text x="470" y="921.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">文本 chunk 与向量 chunk 均落库，ES 同步建立倒排</text>
