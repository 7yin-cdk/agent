<!DOCTYPE html>

<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="980" viewBox="0 0 1080 980" style="display:block">
<text x="540" y="42" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#1a237e">数据库健康巡检流程（定时 + 代码预取 + LLM + 规则兜底）</text><text x="540" y="964" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" fill="#9e9e9e">HealthCheckRunner · @Scheduled 触发 → 代码预取指标+规则判定 → ReAct 定位根因并告警 → 逐指标兜底补发 → HealthCheckRecord 落库 + Trace 持久化</text><rect x="180" y="70" width="560" height="52" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="92.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">1. 触发巡检</text><text x="460" y="109.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">@Scheduled(cron 可配置) 或 POST /healthcheck/run 手动</text><text x="780" y="96" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" fill="#c62828">agent.healthcheck.enabled=false → 直接返回</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="122" x2="460" y2="146" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="150" width="560" height="52" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="172.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">2. 读取配置 agent.healthcheck</text><text x="460" y="189.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">targets（待巡检实例） + thresholds（异常阈值）</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="202" x2="460" y2="226" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="230" width="560" height="56" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="254.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">3. 代码预取指标 + 规则判定</text><text x="460" y="271.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">DatabaseMetricsCollector.collect + AnomalyEvaluator.evaluate</text><text x="780" y="254" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" fill="#455a64">活跃会话 / 缓冲池命中率 / 锁等待 / 死元组 / 复制延迟 …</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="286" x2="460" y2="310" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="314" width="560" height="56" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="338.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">4. 构建巡检 Prompt buildPrompt</text><text x="460" y="355.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">注入每实例指标 JSON + 判定结论 / 可用工具 / 阈值 / 执行步骤 / 输出格式</text><defs><marker id="mab47bc" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ab47bc"/></marker></defs><line x1="460" y1="370" x2="460" y2="394" stroke="#ab47bc" stroke-width="2" marker-end="url(#mab47bc)"/><rect x="180" y="398" width="560" height="52" rx="8" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1.5"/><text x="460" y="420.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#4a148c">5. LLM ReAct 分析 runLlmReAct</text><text x="460" y="437.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">ToolCallingService.chatWithTasks（带 Trace 采集）</text><rect x="780" y="398" width="260" height="122" rx="8" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1.5"/><text x="910" y="438.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#4a148c">ReAct 循环内</text><text x="910" y="455.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" font-weight="normal" fill="#546e7a">· 下钻工具定位根因（指标已预取）</text><text x="910" y="472.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" font-weight="normal" fill="#546e7a">· sendAlertEmail 告警并声明覆盖指标</text><text x="910" y="489.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" font-weight="normal" fill="#546e7a">· 返回巡检总结 llmSummary</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="450" x2="460" y2="474" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="478" width="560" height="52" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="500.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">6. 对每个实例执行以下循环</text><text x="460" y="517.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">persistAndFallback(runId, snapshot, llmSummary)</text><rect x="150" y="558" width="620" height="246" rx="10" fill="none" stroke="#78909c" stroke-width="1.3" stroke-dasharray="6,4"/><text x="160" y="578" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="12.5" font-weight="bold" fill="#455a64">循环：对每个配置的 Target 实例（复用第 3 步快照）</text><rect x="180" y="590" width="560" height="50" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="611.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">7. 兜底判定 AlertCoverageResolver.decide</text><text x="460" y="628.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">规则异常项 − 模型已声明覆盖项 = 待补发项</text><text x="780" y="614" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" fill="#c62828">无覆盖声明 → 视为实例级已覆盖，不补发</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="640" x2="460" y2="658" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="662" width="560" height="50" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="683.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">8. 邮件补发兜底 sendFallback</text><text x="460" y="700.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">差集非空 / 实例连接失败 → 发送补充告警邮件</text><text x="780" y="686" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" fill="#00695c">发送成功 → markSent(runId, 补发指标)</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="712" x2="460" y2="730" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="734" width="560" height="50" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="755.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">9. 落库 HealthCheckRecord</text><text x="460" y="772.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">status: NORMAL / ANOMALY / ERROR · abnormalMetrics JSON</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="784" x2="460" y2="808" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="812" width="560" height="52" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="834.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">10. 持久化 Trace</text><text x="460" y="851.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">traceService.save(collector, SUCCESS/ERROR)</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="864" x2="460" y2="888" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="892" width="560" height="52" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/><text x="460" y="914.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#0d47a1">11. 返回巡检结果</text><text x="460" y="931.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">runId + llmSummary + 各实例 details</text>
</svg>
</body></html>
