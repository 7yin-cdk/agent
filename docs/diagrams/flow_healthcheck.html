<text x="540" y="42" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="24" font-weight="bold" fill="#1a237e">数据库健康巡检流程（定时 + LLM + 规则兜底）</text><text x="540" y="964" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" fill="#9e9e9e">HealthCheckRunner · @Scheduled 触发 → ReAct 巡检 → 规则兜底补发邮件 → HealthCheckRecord 落库 + Trace 持久化</text><rect x="180" y="70" width="560" height="52" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="92.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">1. 触发巡检</text><text x="460" y="109.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">@Scheduled(cron=每分钟) 或 POST /healthcheck/run 手动</text><text x="780" y="96" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" fill="#c62828">agent.healthcheck.enabled=false → 直接返回</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="122" x2="460" y2="146" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="150" width="560" height="52" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="172.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">2. 读取配置 agent.healthcheck</text><text x="460" y="189.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">targets（待巡检实例） + thresholds（异常阈值）</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="202" x2="460" y2="226" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="230" width="560" height="56" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="254.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">3. 构建巡检 Prompt buildPrompt</text><text x="460" y="271.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">实例列表 / 可用工具 / 阈值标准 / 执行步骤 / 输出格式</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="286" x2="460" y2="310" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="314" width="560" height="52" rx="8" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1.5"/><text x="460" y="336.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#4a148c">4. LLM ReAct 巡检 runLlmReAct</text><text x="460" y="353.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">ToolCallingService.chatWithTasks（带 Trace 采集）</text><rect x="780" y="314" width="260" height="122" rx="8" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1.5"/><text x="910" y="346" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#4a148c">ReAct 循环内</text><text x="910" y="363" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" font-weight="normal" fill="#546e7a">· checkDatabaseHealth 取实时指标</text><text x="910" y="380" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" font-weight="normal" fill="#546e7a">· LLM 依阈值判定异常</text><text x="910" y="397" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" font-weight="normal" fill="#546e7a">· sendAlertEmail 发告警邮件</text><text x="910" y="414" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11" font-weight="normal" fill="#546e7a">· 返回巡检总结 llmSummary</text><defs><marker id="mab47bc" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ab47bc"/></marker></defs><line x1="460" y1="366" x2="460" y2="390" stroke="#ab47bc" stroke-width="2" marker-end="url(#mab47bc)"/><rect x="180" y="394" width="560" height="52" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="416.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">5. 对每个实例执行以下循环</text><text x="460" y="433.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">persistAndFallback(runId, target, llmSummary)</text><rect x="150" y="474" width="620" height="310" rx="10" fill="none" stroke="#78909c" stroke-width="1.3" stroke-dasharray="6,4"/><text x="160" y="494" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="12.5" font-weight="bold" fill="#455a64">循环：对每个配置的 Target 实例</text><rect x="180" y="506" width="560" height="50" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="527.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">6. 采集实时指标</text><text x="460" y="544.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">DatabaseMetricsCollector.collect(target)</text><text x="780" y="530" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" fill="#455a64">activeSessions / bufferHitRate / lockWaitingSessions / idleInTransaction / deadTupleRatio / replicationLag…</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="556" x2="460" y2="574" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="578" width="560" height="50" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="599.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">7. 规则兜底判定</text><text x="460" y="616.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">AnomalyEvaluator.evaluate(metrics, thresholds)</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="628" x2="460" y2="646" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="650" width="560" height="50" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="671.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">8. 判定并落库 HealthCheckRecord</text><text x="460" y="688.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">status: NORMAL / ANOMALY / ERROR · abnormalMetrics JSON</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="700" x2="460" y2="718" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="722" width="560" height="50" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="743.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">9. 邮件补发兜底</text><text x="460" y="760.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">LLM 未发(wasSent=false) 且异常/连接错误 → sendFallback</text><text x="780" y="744" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" fill="#00695c">发送成功 → sendRegistry.markSent(runId, instance)</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="772" x2="460" y2="808" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="812" width="560" height="52" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/><text x="460" y="834.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#e65100">10. 持久化 Trace</text><text x="460" y="851.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">traceService.save(collector, SUCCESS/ERROR)</text><defs><marker id="mfb8c00" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker></defs><line x1="460" y1="864" x2="460" y2="888" stroke="#fb8c00" stroke-width="2" marker-end="url(#mfb8c00)"/><rect x="180" y="892" width="560" height="52" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/><text x="460" y="914.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="14.5" font-weight="bold" fill="#0d47a1">11. 返回巡检结果</text><text x="460" y="931.5" text-anchor="middle" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif" font-size="11.5" font-weight="normal" fill="#546e7a">runId + llmSummary + 各实例 details</text>
