<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 文档问答</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7f9;
            --panel: #ffffff;
            --text: #1f2937;
            --muted: #667085;
            --line: #dde3ea;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #0f8f54;
            --danger: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        main {
            width: min(1080px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            margin: 0 0 24px;
            color: var(--muted);
            line-height: 1.6;
        }

        .layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 18px;
            align-items: start;
        }

        section {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        h2 {
            margin: 0 0 14px;
            font-size: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="file"],
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            font: inherit;
        }

        input[type="file"] {
            padding: 10px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
            padding: 12px;
            line-height: 1.6;
        }

        button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 42px;
            margin-top: 14px;
            border: 0;
            border-radius: 6px;
            background: var(--primary);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .status {
            min-height: 22px;
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .status.success {
            color: var(--success);
        }

        .status.error {
            color: var(--danger);
        }

        .answer {
            min-height: 220px;
            margin-top: 14px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fafbfc;
            white-space: pre-wrap;
            line-height: 1.7;
        }

        @media (max-width: 820px) {
            main {
                width: min(100% - 24px, 720px);
                padding: 24px 0;
            }

            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>RAG 文档问答</h1>
    <p class="subtitle">先上传文档入库，再输入问题调用 RAG 查询接口。</p>

    <div class="layout">
        <section>
            <h2>文档上传</h2>
            <label for="fileInput">选择文件</label>
            <input type="file" id="fileInput">
            <button id="uploadButton" type="button">上传文档</button>
            <p id="uploadStatus" class="status"></p>
        </section>

        <section>
            <h2>文档问答</h2>
            <label for="questionInput">问题</label>
            <textarea id="questionInput" placeholder="请输入要咨询的文档问题"></textarea>
            <button id="queryButton" type="button">提交问题</button>
            <p id="queryStatus" class="status"></p>
            <div id="answerBox" class="answer">回答会显示在这里。</div>
        </section>
    </div>
</main>

<script>
    const uploadButton = document.getElementById("uploadButton");
    const queryButton = document.getElementById("queryButton");
    const uploadStatus = document.getElementById("uploadStatus");
    const queryStatus = document.getElementById("queryStatus");
    const answerBox = document.getElementById("answerBox");

    function setStatus(element, message, type = "") {
        element.textContent = message;
        element.className = type ? `status ${type}` : "status";
    }

    uploadButton.addEventListener("click", async () => {
        const file = document.getElementById("fileInput").files[0];
        if (!file) {
            setStatus(uploadStatus, "请先选择要上传的文件。", "error");
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        uploadButton.disabled = true;
        setStatus(uploadStatus, "正在上传，请稍候...");

        try {
            const response = await fetch("http://localhost:8088/rag/ingest", {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            setStatus(uploadStatus, "上传成功，系统会继续处理文档入库。", "success");
        } catch (error) {
            setStatus(uploadStatus, `上传失败：${error.message}`, "error");
        } finally {
            uploadButton.disabled = false;
        }
    });

    queryButton.addEventListener("click", async () => {
        const question = document.getElementById("questionInput").value.trim();
        if (!question) {
            setStatus(queryStatus, "请输入问题。", "error");
            return;
        }

        const formData = new FormData();
        formData.append("question", question);

        queryButton.disabled = true;
        answerBox.textContent = "";
        setStatus(queryStatus, "正在查询，请稍候...");

        try {
            const response = await fetch("http://localhost:8088/rag/query", {
                method: "POST",
                body: formData
            });

            const text = await response.text();
            if (!response.ok) {
                throw new Error(text || `HTTP ${response.status}`);
            }

            answerBox.textContent = text || "接口返回为空。";
            setStatus(queryStatus, "查询完成。", "success");
        } catch (error) {
            answerBox.textContent = "查询失败。";
            setStatus(queryStatus, `查询失败：${error.message}`, "error");
        } finally {
            queryButton.disabled = false;
        }
    });
</script>
</body>
</html>
