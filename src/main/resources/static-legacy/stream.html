<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 流式对话</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1a1a2e; color: #eee;
        height: 100vh; display: flex; flex-direction: column;
    }
    .header {
        background: #16213e; padding: 12px 20px;
        border-bottom: 1px solid #0f3460;
        display: flex; align-items: center; gap: 12px;
    }
    .header h1 { font-size: 18px; font-weight: 600; color: #e94560; }
    .header .status { font-size: 12px; color: #888; margin-left: auto; }
    .header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .header .dot.idle { background: #4caf50; }
    .header .dot.streaming { background: #e94560; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .msg { display: flex; gap: 10px; max-width: 85%; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }
    .msg .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .msg.user .avatar { background: #e94560; }
    .msg.assistant .avatar { background: #0f3460; }
    .msg .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
    .msg.user .bubble { background: #e94560; color: #fff; }
    .msg.assistant .bubble { background: #16213e; color: #ddd; }
    .msg.assistant .bubble.typing::after {
        content: ""; display: inline-block; width: 3px; height: 16px;
        background: #e94560; margin-left: 2px; vertical-align: text-bottom;
        animation: blink .8s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .input-area { background: #16213e; padding: 14px 20px; border-top: 1px solid #0f3460; display: flex; gap: 10px; }
    .input-area input { flex: 1; background: #1a1a2e; border: 1px solid #0f3460; border-radius: 8px; padding: 10px 14px; color: #eee; font-size: 14px; outline: none; }
    .input-area input:focus { border-color: #e94560; }
    .input-area button { background: #e94560; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; }
    .input-area button:hover { background: #c73652; }
    .input-area button:disabled { background: #555; cursor: not-allowed; }

    .login-bar { display: flex; gap: 10px; align-items: center; padding: 8px 20px; background: #0f3460; font-size: 13px; }
    .login-bar input { background: #1a1a2e; border: 1px solid #0f3460; border-radius: 4px; padding: 6px 10px; color: #eee; font-size: 12px; }
    .login-bar button { background: #e94560; color: #fff; border: none; border-radius: 4px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
    .login-bar .info { color: #888; margin-left: auto; }
    .error-toast { position: fixed; top: 60px; right: 20px; background: #e94560; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 999; display: none; }
</style>
</head>
<body>
<div class="header">
    <h1>Agent 流式对话</h1>
    <span class="status"><span class="dot idle" id="dot"></span><span id="statusText">就绪</span></span>
</div>
<div class="login-bar" id="loginBar">
    <input id="loginUser" placeholder="用户名">
    <input id="loginPass" type="password" placeholder="密码">
    <button onclick="doLogin()">登录</button>
    <button onclick="doRegister()">注册</button>
    <span class="info" id="loginInfo">请先登录</span>
</div>
<div class="error-toast" id="toast"></div>
<div class="messages" id="messages"></div>
<div class="input-area">
    <input id="queryInput" placeholder="输入消息，按 Enter 发送..." onkeydown="if(event.key==='Enter')send()" disabled>
    <button id="sendBtn" onclick="send()" disabled>发送</button>
</div>

<script>
let token = null;
let conversationId = null;
let streaming = false;

function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
}

async function doLogin() {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value.trim();
    if (!u || !p) { toast('请输入用户名和密码'); return; }
    try {
        const r = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        if (!r.ok) { const msg = await r.text(); throw new Error(msg); }
        const d = await r.json();
        token = d.token;
        document.getElementById('loginInfo').textContent = '已登录: ' + (d.user ? d.user.nickname : u);
        document.getElementById('loginBar').style.display = 'none';
        document.getElementById('queryInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        toast('登录成功');
    } catch (e) {
        toast('登录失败: ' + e.message);
    }
}

async function doRegister() {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value.trim();
    if (!u || !p) { toast('请输入用户名和密码'); return; }
    try {
        const r = await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p, nickname: u })
        });
        if (!r.ok) { const msg = await r.text(); throw new Error(msg); }
        toast('注册成功，请点击登录');
        /* 自动登录 */
        await doLogin();
    } catch (e) {
        toast('注册失败: ' + e.message);
    }
}

async function send() {
    const input = document.getElementById('queryInput');
    const query = input.value.trim();
    if (!query || streaming) return;

    if (!token) { toast('请先登录'); return; }

    input.value = '';
    streaming = true;
    setStatus(true);
    document.getElementById('sendBtn').disabled = true;

    appendMsg('user', query);
    const aiEl = appendMsg('assistant', '');
    const bubble = aiEl.querySelector('.bubble');

    let fullAnswer = '';
    try {
        const resp = await fetch('/agent/chat/reactive/stream', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ query, conversationId })
        });

        if (!resp.ok) {
            const errText = await resp.text();
            throw new Error('HTTP ' + resp.status + ': ' + errText);
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buf = '';

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const blocks = buf.split(/\r?\n\r?\n/);
            buf = blocks.pop() || '';
            for (const block of blocks) {
                if (!block.trim()) continue;
                fullAnswer = handleBlock(block, bubble, fullAnswer);
                /* Yield to browser so DOM repaint happens between deltas */
                await new Promise(r => setTimeout(r, 20));
            }
        }
        /* Flush remaining buffer */
        if (buf.trim()) fullAnswer = handleBlock(buf, bubble, fullAnswer);

    } catch (e) {
        bubble.textContent = 'Error: ' + e.message;
        console.error('Stream error:', e);
    }

    streaming = false;
    setStatus(false);
    bubble.classList.remove('typing');
    document.getElementById('sendBtn').disabled = false;

    /* Scroll to bottom */
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
}

function handleBlock(block, bubble, fullAnswer) {
    let eventType = 'message', data = '';
    for (const line of block.split('\n')) {
        const t = line.trim();
        if (t.startsWith('event:')) eventType = t.substring(6).trim();
        else if (t.startsWith('data:')) data += t.substring(5);
    }
    if (!data) return fullAnswer;

    try {
        const payload = JSON.parse(data);
        switch (eventType) {
            case 'meta':
                conversationId = payload.conversationId;
                break;
            case 'delta':
                fullAnswer += payload.content;
                bubble.textContent = fullAnswer;
                bubble.classList.add('typing');
                /* Auto-scroll */
                const msgs = document.getElementById('messages');
                msgs.scrollTop = msgs.scrollHeight;
                break;
            case 'done':
                break;
            case 'error':
                bubble.textContent = 'Error: ' + (payload.message || 'Unknown');
                bubble.classList.remove('typing');
                break;
        }
    } catch (e) {
        console.warn('SSE parse error:', data, e);
    }
    return fullAnswer;
}

function appendMsg(role, content) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.innerHTML = '<div class="avatar">' + (role === 'user' ? 'U' : 'AI') + '</div>'
        + '<div class="bubble">' + escapeHtml(content) + '</div>';
    const msgs = document.getElementById('messages');
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    return el;
}

function setStatus(active) {
    const dot = document.getElementById('dot');
    dot.className = 'dot' + (active ? ' streaming' : ' idle');
    document.getElementById('statusText').textContent = active ? '流式生成中...' : '就绪';
}

function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}
</script>
</body>
</html>
