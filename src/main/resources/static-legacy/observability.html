<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 可观测性</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f5f6fa;
  color: #2d3436;
  min-height: 100vh;
}

/* Top Bar */
.topbar {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(102,126,234,0.3);
}
.topbar h1 { font-size: 20px; font-weight: 600; }
.topbar a { color: #fff; text-decoration: none; opacity: 0.85; font-size: 14px; }
.topbar a:hover { opacity: 1; }

/* Stats Bar */
.stats-bar {
  display: flex;
  gap: 16px;
  padding: 16px 24px;
  background: #fff;
  border-bottom: 1px solid #e8e8e8;
}
.stat-card {
  flex: 1;
  background: #f8f9ff;
  border-radius: 10px;
  padding: 14px 18px;
  text-align: center;
  border: 1px solid #eef0ff;
}
.stat-card .value { font-size: 24px; font-weight: 700; color: #667eea; }
.stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }

/* Layout */
.layout { display: flex; height: calc(100vh - 120px); }

/* Left Panel */
.left-panel {
  width: 380px;
  min-width: 380px;
  background: #fff;
  border-right: 1px solid #e8e8e8;
  display: flex;
  flex-direction: column;
}
.left-panel-header {
  padding: 14px 16px;
  border-bottom: 1px solid #f0f0f0;
  font-weight: 600;
  font-size: 14px;
  color: #555;
}
.trace-list { flex: 1; overflow-y: auto; }
.trace-item {
  padding: 12px 16px;
  border-bottom: 1px solid #f5f5f5;
  cursor: pointer;
  transition: background 0.15s;
}
.trace-item:hover { background: #f8f9ff; }
.trace-item.active { background: #eff2ff; border-left: 3px solid #667eea; }
.trace-item .trace-time { font-size: 12px; color: #999; margin-bottom: 4px; }
.trace-item .trace-query {
  font-size: 13px;
  color: #333;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 6px;
}
.trace-item .trace-meta {
  display: flex;
  gap: 8px;
  align-items: center;
}
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
.tag-intent { background: #e8f5e9; color: #2e7d32; }
.tag-tokens { background: #fff3e0; color: #e65100; }
.tag-duration { background: #e3f2fd; color: #1565c0; }
.tag-error { background: #ffebee; color: #c62828; }
.tag-success { background: #e8f5e9; color: #2e7d32; }

/* Right Panel */
.right-panel { flex: 1; overflow-y: auto; background: #f5f6fa; }
.right-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #bbb;
  font-size: 14px;
}
.detail-container { padding: 20px 24px; max-width: 900px; }

.detail-section { margin-bottom: 20px; }
.detail-section h3 {
  font-size: 14px;
  color: #667eea;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 2px solid #eef0ff;
}

.user-query-box {
  background: #fff;
  border-radius: 10px;
  padding: 14px 18px;
  font-size: 14px;
  line-height: 1.6;
  border: 1px solid #e8e8e8;
  white-space: pre-wrap;
  word-break: break-word;
}

.llm-call-card {
  background: #fff;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 1px solid #e8e8e8;
  overflow: hidden;
}
.llm-call-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
  background: #fafbff;
  user-select: none;
}
.llm-call-header:hover { background: #f0f2ff; }
.llm-call-header .title {
  font-size: 13px;
  font-weight: 600;
  color: #333;
}
.llm-call-header .meta { display: flex; gap: 10px; align-items: center; }
.llm-call-body {
  display: none;
  padding: 0 16px 14px;
  border-top: 1px solid #f0f0f0;
}
.llm-call-body.open { display: block; }
.llm-call-body pre {
  background: #f8f9fa;
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 300px;
  overflow-y: auto;
  margin-top: 8px;
}
.llm-call-body .field-label {
  font-size: 11px;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 10px;
  margin-bottom: 4px;
}

.tool-call-card {
  background: #fff;
  border-radius: 10px;
  margin-bottom: 8px;
  border: 1px solid #e8e8e8;
  overflow: hidden;
}
.tool-call-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
  background: #fafbff;
  user-select: none;
}
.tool-call-header:hover { background: #f0f2ff; }
.tool-call-header .tool-name {
  font-size: 13px;
  font-weight: 600;
  color: #e65100;
  font-family: 'SF Mono', 'Fira Code', monospace;
}
.tool-call-header .tool-status {
  font-size: 12px;
}
.tool-call-body {
  display: none;
  padding: 0 16px 14px;
  border-top: 1px solid #f0f0f0;
}
.tool-call-body.open { display: block; }
.tool-call-body pre {
  background: #f8f9fa;
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 200px;
  overflow-y: auto;
  margin-top: 8px;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.summary-item {
  background: #fff;
  border-radius: 10px;
  padding: 14px;
  text-align: center;
  border: 1px solid #e8e8e8;
}
.summary-item .val { font-size: 20px; font-weight: 700; color: #667eea; }
.summary-item .lbl { font-size: 11px; color: #999; margin-top: 4px; }

.loading { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }
.chevron { transition: transform 0.2s; font-size: 12px; color: #aaa; }
.chevron.open { transform: rotate(90deg); }
</style>
</head>
<body>

<div class="topbar">
  <h1>Agent 可观测性</h1>
  <a href="index.html">← 返回对话</a>
</div>

<div id="debugStatus" style="background:#fff3cd;color:#856404;padding:8px 24px;font-size:12px;border-bottom:1px solid #ffc107;display:none;"></div>
<div class="stats-bar" id="statsBar">
  <div class="stat-card"><div class="value" id="statTraces">-</div><div class="label">总对话轮次</div></div>
  <div class="stat-card"><div class="value" id="statTokens">-</div><div class="label">总 Token 消耗</div></div>
  <div class="stat-card"><div class="value" id="statSuccess">-</div><div class="label">成功率</div></div>
  <div class="stat-card"><div class="value" id="statAvgDur">-</div><div class="label">平均耗时</div></div>
</div>

<div class="layout">
  <div class="left-panel">
    <div class="left-panel-header">对话轮次列表</div>
    <div class="trace-list" id="traceList">
      <div class="loading">加载中...</div>
    </div>
  </div>
  <div class="right-panel" id="rightPanel">
    <div class="right-empty">← 点击左侧条目查看详情</div>
  </div>
</div>

<script>
const TOKEN_KEY = 'agent_token';
const API = window.location.origin.includes("8084") ? "" : "http://localhost:8084";

function getToken() {
  return localStorage.getItem(TOKEN_KEY);
}

async function apiGet(path) {
  try {
    const token = getToken();
    var statusEl = document.getElementById('debugStatus');
    if (statusEl) statusEl.textContent = 'Calling: ' + path;
    const resp = await fetch(API + path, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (statusEl) statusEl.textContent = path + ' -> HTTP ' + resp.status;
    if (resp.status === 401) {
      window.location.href = 'index.html';
      return null;
    }
    if (!resp.ok) {
      var text = await resp.text();
      if (statusEl) statusEl.textContent = path + ' -> HTTP ' + resp.status + ': ' + text.substring(0, 100);
      return null;
    }
    return await resp.json();
  } catch (e) {
    var statusEl = document.getElementById('debugStatus');
    if (statusEl) statusEl.textContent = 'ERROR: ' + path + ' -> ' + e.message;
    return null;
  }
}

function formatTime(ts) {
  if (!ts) return '-';
  try {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return String(ts).substring(0, 19);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch(e) { return '-'; }
}
function formatMs(ms) {
  if (!ms && ms !== 0) return '-';
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(1) + 's';
}
function formatTokens(n) {
  if (!n && n !== 0) return '0';
  if (n < 1000) return String(n);
  return (n / 1000).toFixed(1) + 'K';
}

function showError(elId, msg) {
  const el = document.getElementById(elId);
  if (el) el.innerHTML = '<div style="text-align:center;padding:20px;color:#e74c3c;">' + msg + '</div>';
}

/* Load stats */
async function loadStats() {
  try {
    const data = await apiGet('/agent/observability/stats');
    if (!data) { showError('statsBar','统计加载失败'); return; }
    document.getElementById('statTraces').textContent = data.totalTraces;
    document.getElementById('statTokens').textContent = formatTokens(data.totalTokens);
    const rate = data.totalTraces > 0 ? Math.round(data.successCount / data.totalTraces * 100) : 0;
    document.getElementById('statSuccess').textContent = rate + '%';
    document.getElementById('statAvgDur').textContent = formatMs(Math.round(data.avgDurationMs));
  } catch(e) { showError('statsBar','统计加载异常'); }
}

/* Load trace list */
let traces = [];
async function loadTraces() {
  try {
    traces = await apiGet('/agent/observability/traces');
    const list = document.getElementById('traceList');
    if (!traces) { showError('traceList','数据加载失败，请确认已发送过对话'); return; }
    if (traces.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:40px;color:#bbb;font-size:13px;">暂无数据<br><span style="font-size:11px;">发送一轮对话后刷新页面</span></div>';
      return;
    }
    list.innerHTML = traces.map((t, i) => `
      <div class="trace-item" data-index="${i}" onclick="selectTrace(${i})">
        <div class="trace-time">${formatTime(t.createdAt)}</div>
        <div class="trace-query">${escapeHtml(t.userQuery || '')}</div>
        <div class="trace-meta">
          <span class="tag tag-intent">${t.intentType || '-'}</span>
          <span class="tag tag-tokens">${formatTokens(t.totalTokens)} tokens</span>
          <span class="tag tag-duration">${formatMs(t.totalDurationMs)}</span>
          <span class="tag ${t.status === 'SUCCESS' ? 'tag-success' : 'tag-error'}">${t.status}</span>
        </div>
      </div>
    `).join('');
  } catch(e) { showError('traceList','列表加载异常: ' + e.message); }
}

function escapeHtml(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

/* Select trace */
let selectedIdx = -1;
async function selectTrace(idx) {
  try {
    selectedIdx = idx;
    document.querySelectorAll('.trace-item').forEach(el => el.classList.remove('active'));
    document.querySelector('.trace-item[data-index="' + idx + '"]')?.classList.add('active');

    const trace = traces[idx];
    if (!trace) return;
    document.getElementById('rightPanel').innerHTML = '<div class="loading">加载中...</div>';
    const detail = await apiGet('/agent/observability/traces/' + trace.traceId);
    if (!detail) {
      document.getElementById('rightPanel').innerHTML = '<div class="right-empty">加载详情失败</div>';
      return;
    }
    renderDetail(detail);
  } catch(e) {
    document.getElementById('rightPanel').innerHTML = '<div class="right-empty">异常: ' + e.message + '</div>';
  }
}

function renderDetail(detail) {
  try {
    const t = detail.trace;
    if (!t) { document.getElementById('rightPanel').innerHTML = '<div class="right-empty">无数据</div>'; return; }
    const llmCalls = detail.llmCalls || [];
    const toolCalls = detail.toolCalls || [];

    let html = '<div class="detail-container">';

    html += '<div class="detail-section"><h3>汇总</h3>';
    html += '<div class="summary-grid">';
    html += `<div class="summary-item"><div class="val">${t.llmCallCount || 0}</div><div class="lbl">LLM 调用次数</div></div>`;
    html += `<div class="summary-item"><div class="val">${t.toolCallCount || 0}</div><div class="lbl">工具调用次数</div></div>`;
    html += `<div class="summary-item"><div class="val">${formatTokens(t.totalTokens)}</div><div class="lbl">总 Token</div></div>`;
    html += `<div class="summary-item"><div class="val">${formatMs(t.totalDurationMs)}</div><div class="lbl">总耗时</div></div>`;
    html += '</div></div>';

    html += '<div class="detail-section"><h3>用户提问</h3>';
    html += `<div class="user-query-box">${escapeHtml(t.userQuery)}</div></div>`;

    html += `<div class="detail-section"><h3>LLM 调用记录（${llmCalls.length}）</h3>`;
    llmCalls.forEach(function(c) {
      html += `<div class="llm-call-card">
        <div class="llm-call-header" onclick="toggleCard(this)">
          <span class="title">#${c.callSequence} ${escapeHtml(c.callType)} ${c.modelName ? '· ' + escapeHtml(c.modelName) : ''}</span>
          <span class="meta">
            <span class="tag tag-tokens">in:${c.inputTokens || 0} out:${c.outputTokens || 0}</span>
            <span class="tag tag-duration">${formatMs(c.durationMs)}</span>
            <span class="chevron">▶</span>
          </span>
        </div>
        <div class="llm-call-body">
          <div class="field-label">Input Prompt</div>
          <pre>${escapeHtml(c.inputPrompt)}</pre>
          <div class="field-label">Output Response</div>
          <pre>${escapeHtml(c.outputResponse)}</pre>
        </div>
      </div>`;
    });
    html += '</div>';

    html += `<div class="detail-section"><h3>工具调用记录（${toolCalls.length}）</h3>`;
    toolCalls.forEach(function(c) {
      html += `<div class="tool-call-card">
        <div class="tool-call-header" onclick="toggleCard(this)">
          <span class="tool-name">${escapeHtml(c.toolName)}</span>
          <span class="tool-status">
            <span class="tag ${c.success ? 'tag-success' : 'tag-error'}">${c.success ? '成功' : '失败'}</span>
            <span class="tag tag-duration">${formatMs(c.durationMs)}</span>
            <span class="chevron">▶</span>
          </span>
        </div>
        <div class="tool-call-body">
          <div class="field-label">输入参数</div>
          <pre>${escapeHtml(c.toolInput)}</pre>
          <div class="field-label">输出结果</div>
          <pre>${escapeHtml(c.toolOutput)}</pre>
        </div>
      </div>`;
    });
    html += '</div>';

    if (t.errorMessage) {
      html += '<div class="detail-section"><h3>错误信息</h3>';
      html += `<div class="user-query-box" style="color:#c62828;">${escapeHtml(t.errorMessage)}</div></div>`;
    }

    html += '</div>';
    document.getElementById('rightPanel').innerHTML = html;
  } catch(e) {
    document.getElementById('rightPanel').innerHTML = '<div class="right-empty">渲染异常: ' + e.message + '</div>';
  }
}

function toggleCard(header) {
  const body = header.nextElementSibling;
  const chevron = header.querySelector('.chevron');
  if (body) body.classList.toggle('open');
  if (chevron) chevron.classList.toggle('open');
}

/* Init */
(function() {
  var dbg = document.getElementById('debugStatus');
  if (dbg) dbg.style.display = 'block';
  if (!getToken()) {
    window.location.href = 'index.html';
    return;
  }
  if (dbg) dbg.textContent = 'Token: ' + getToken().substring(0, 12) + '... starting API calls';
  loadStats().catch(function(e) { if (dbg) dbg.textContent = 'Stats error: ' + e.message; });
  loadTraces().then(function() {
    if (traces && traces.length > 0) selectTrace(0);
  }).catch(function(e) { console.error('loadTraces failed:', e); });
})();
</script>
</body>
</html>
